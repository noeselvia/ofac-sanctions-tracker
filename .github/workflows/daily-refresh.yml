name: Daily OFAC refresh

on:
  schedule:
    - cron: "17 11 * * *"   # every day 11:17 UTC (07:17 Santo Domingo)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline (scrape + snapshot diff + rebuild)
        run: python -m ofac_tracker.pipeline
        env:
          PYTHONPATH: src

      - name: Commit refreshed data
        run: |
          git config user.name  "ofac-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "data: OFAC refresh $(date -u +%Y-%m-%d)"
            git push
          fi
